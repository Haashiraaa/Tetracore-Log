

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tetracore-log"
# The version below is managed by release-please (see docs/releasing.md). Never edit it by hand.
version = "0.4.0"
description = "Digital gate log for CNG stations"
readme = "README.md"
requires-python = ">=3.10"
# Dependencies are pinned to exact versions on purpose: lint, types, migrations and the test
# suite passed on these, and a surprise upgrade must never be what turns CI red or breaks a
# deploy. To upgrade: bump in a branch, let CI run, merge only if green.
dependencies = [
    "fastapi==0.162.4",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.3",
    "sqlalchemy==2.0.57",
    "alembic==1.20.1",
    "psycopg[binary]==3.3.8",
    "python-dotenv==1.2.4",
    "argon2-cffi==25.1.0",
    "PyJWT==2.15.1",
    "haashi==1.3.2",
]

[project.optional-dependencies]
dev = [
    "autopep8==2.3.2",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "httpx2==2.15.1",   # FastAPI's TestClient; plain httpx is deprecated for it
    "ruff==0.17.4",
    "pyright==1.1.414",
]

[tool.setuptools.packages.find]
include = ["backend*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[project.scripts]
tetracore-log = "backend.src.main:serve"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Security"]

[tool.pyright]
include = ["backend", "scripts", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "standard"
