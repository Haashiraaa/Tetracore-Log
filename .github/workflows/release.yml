name: Release

# Keeps ONE open pull request called "chore(main): release X.Y.Z" up to date. It contains the
# new CHANGELOG.md entry and the version bump. Merging that pull request is what creates the
# tag (vX.Y.Z) and the GitHub Release. Nothing is tagged or released until a person merges it.
#
# The release pull request is opened with a personal access token (secret
# RELEASE_PLEASE_TOKEN), because pull requests opened with the default token do not start CI,
# and then the required check `ci-ok` would never appear on it. Without that secret this
# still works, but CI will not run on the release pull request. See docs/releasing.md.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    # Releases come from main only. The trigger above already limits this to pushes to main;
    # this guard keeps it true if someone later adds workflow_dispatch or more branches.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
